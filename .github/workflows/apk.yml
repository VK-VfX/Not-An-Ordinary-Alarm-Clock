name: Build APK
# Builds a debug-signed, sideloadable APK as a downloadable workflow artifact. Does NOT publish a release.
on:
  pull_request:
    paths: ["android/**", "index.html", "app.js", "app.css", "vendor/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MapsAndCats-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
